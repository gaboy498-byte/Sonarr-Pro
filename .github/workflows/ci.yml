name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and test backend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Prepare verified hardened MonoTorrent
        run: bash .github/scripts/prepare-monotorrent.sh

      - name: Restore with dependency auditing
        run: >-
          dotnet restore src/Sonarr.sln -p:Configuration=Debug
          --configfile "$MONOTORRENT_NUGET_CONFIG" --force --no-http-cache
          -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low

      - name: Verify resolved MonoTorrent
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          assets = Path('_temp/obj/Sonarr.Core/project.assets.json')
          libraries = json.loads(assets.read_text())['libraries']
          resolved = [name for name in libraries if name.split('/')[0].lower() == 'monotorrent']
          expected = ['MonoTorrent/3.0.2-sonarrsecurity.1.rev0002']
          if resolved != expected:
              raise SystemExit(f'Unexpected resolved MonoTorrent: {resolved}')
          print(f'Verified resolved dependency: {resolved[0]}')
          PY

      - name: Validate public Six Labors license for Sonarr.Core
        run: >-
          dotnet msbuild src/NzbDrone.Core/Sonarr.Core.csproj -nologo
          -t:SixLabors_ValidateLicense -p:Configuration=Release -p:TargetFramework=net10.0

      # Building the solution rather than individual projects is required, not a
      # preference: Directory.Build.props pulls in stylecop.json through $(SolutionDir),
      # which is only defined for a solution build. Building a bare .csproj silently
      # drops the StyleCop configuration and fails on every using directive in the repo.
      - name: Build
        run: dotnet build src/Sonarr.sln -c Debug --no-restore

      - name: Test
        run: dotnet test src/NzbDrone.Core.Test/Sonarr.Core.Test.csproj -c Debug --no-build --no-restore --logger "console;verbosity=minimal"

  frontend:
    name: Lint and build frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile --network-timeout 600000

      - run: yarn lint

      - run: yarn stylelint -f github

      # --env production is the difference between a real bundle and multi-megabyte
      # eval-source-map output that renders as a blank page.
      - run: yarn build --env production

  docker:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Preserve the PR check. Publication remains manual-only in docker.yml.
    # The repository's approved assembly-scoped Community license covers Sonarr.Core.
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare verified hardened MonoTorrent
        run: bash .github/scripts/prepare-monotorrent.sh

      - name: Prepare tracked Docker build context
        id: build_context
        run: python3 .github/scripts/prepare-docker-context.py

      - uses: docker/setup-buildx-action@v3

      # amd64 only, and no push: this is here so a pull request cannot break the
      # image build without anyone noticing until release day.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.build_context.outputs.context }}
          file: ${{ steps.build_context.outputs.context }}/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
